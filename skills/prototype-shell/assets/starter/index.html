<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Prototype review</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./shell.css">
  <script type="module" src="./shell.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="mast">
    <div class="mast-inner">
      <a class="brand" id="home" href="./" aria-label="Project overview">
        <span class="brand-mark" id="brand-mark" aria-hidden="true"></span>
        <img id="logo" alt="" hidden>
        <span id="project-name">Prototype review</span>
      </a>
      <nav aria-label="Workspace">
        <a href="./" id="overview-link">Overview</a>
        <span class="mast-divider" aria-hidden="true"></span>
        <label class="screen-picker">
          <span class="sr-only">Quick screen picker</span>
          <select id="screen" aria-label="Quick screen picker"></select>
        </label>
      </nav>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <section id="overview" class="overview wrap" aria-labelledby="overview-title" hidden>
      <div class="overview-head">
        <div>
          <p class="kicker">Prototype review</p>
          <h1 id="overview-title">Project overview</h1>
        </div>
        <p id="project-summary" class="summary"></p>
      </div>
      <div id="features"></div>
    </section>

    <section id="unavailable" class="notice wrap" hidden>
      <h1>Situation unavailable</h1>
      <p>This link does not match a configured situation in this project.</p>
      <a id="recover" href="./">Return to the overview</a>
    </section>

    <section id="review" class="review wrap" aria-labelledby="review-title" hidden>
      <div class="review-head">
        <div><p id="scenario-name" class="kicker"></p><h1 id="review-title"></h1></div>
        <button id="copy-link" class="primary" type="button">Copy situation link</button>
      </div>
      <div id="share-fallback" class="fallback" hidden>
        <label>Copy this link<input id="share-url" type="url" readonly></label>
      </div>

      <div class="toolbar" aria-label="Situation controls" role="group">
        <label>Persona<select id="role"></select></label>
        <label>State<select id="state"></select></label>
        <label>Format<select id="format"></select></label>
        <div class="record"><span>Example record</span><strong id="record"></strong></div>
      </div>

      <div class="review-grid">
        <section class="panel preview-panel" aria-labelledby="preview-heading">
          <div class="panel-head"><h2 id="preview-heading">Preview</h2><output id="dimensions" aria-label="Preview dimensions"></output></div>
          <div class="stage"><div id="frame-area"><div id="frame-size">
            <iframe id="preview" title="Prototype preview"></iframe>
          </div></div></div>
        </section>
        <section class="panel doc-panel" aria-labelledby="docs-heading">
          <div class="panel-head"><h2 id="docs-heading">Documentation</h2><button id="open-spec" class="text-action" type="button" hidden>Open spec</button></div>
          <div class="doc-nav"><button type="button" class="secondary" id="open-explanation">Open explanation for this screen</button></div>
          <div id="document-content" class="doc-content" role="region" aria-label="Open document" tabindex="0">No explanation is available for this screen.</div>
        </section>
      </div>
    </section>
    <noscript>Enable JavaScript to open the project overview and review a prototype.</noscript>
  </main>
  <div id="status" class="sr-only" role="status"></div>
</body>
</html>

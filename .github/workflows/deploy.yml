name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: io-skills-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Test the prototype
        run: npm run test:prototype
      - name: Deploy to Prophets
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          : "${VERCEL_ORG_ID:?Set the Prophets team ID in Actions variables}"
          : "${VERCEL_PROJECT_ID:?Set the io-skills project ID in Actions variables}"
          : "${VERCEL_TOKEN:?Set the io-skills deploy token in Actions secrets}"
          npx --yes vercel@64.0.2 deploy --yes --prod --token "$VERCEL_TOKEN"
